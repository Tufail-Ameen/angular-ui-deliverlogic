<main class="main">
  <div class="main-content">
    <div class="inner-scroll-content">

      <div class="toolbar-container">
        <div class="location-input-container">
          <div class="location-input" (click)="openOrderTypeModal()">
            <ion-icon name="location" style="color: var(--ion-color-primary); font-size: 20px; margin-right: 4px;"
              class=""></ion-icon>
            <span>Takeout > ASAP, {{ date | date:'MM/dd' }}</span>
            <ion-icon name="chevron-down" class="dwon-up-icon"></ion-icon>
          </div>
        </div>

        <p class="shareableLink">Share this easy ordering link with friends</p>
      </div>

      <ion-row class="" style="height: 100%;">
        <ion-col size="1"></ion-col>
        <ion-col size="10">
          <ion-row>
            <ion-col size="1"></ion-col>
            <ion-col size="10">

              <div>
                <h1 class="restaurants-available-heading">10 Restaurants Available</h1>
              </div>

              <ion-row class="">
                <ion-col size="6" class="" style="padding: 5px;;" *ngFor="let restaurant of restaurants">
                  <div class="card-container">
                    <div class="">
                      <img class="card-image" [src]="restaurant.image" [alt]="restaurant.name + ' image'"
                        (error)="onImageError($event)">
                    </div>
                    <div class="item-content">
                      <ion-card-title class="resturant-card">
                        <div class="title">
                          {{ restaurant.name }}
                        </div>
                      </ion-card-title>

                      <div style="margin-top: 14px;">
                        <div class="description">
                          {{ restaurant.categories.join(', ') }}
                        </div>
                      </div>

                      <div class="info">
                        <span class="time-container">
                          <ion-icon name="time" class="time-icon"></ion-icon>
                          <div class=""> {{ restaurant.time }} </div>
                        </span>
                        <span class="distance-container">
                          <ion-icon name="location" class="location-icon"></ion-icon>
                          <div class="distance">{{ restaurant.distance }}</div>
                        </span>
                      </div>
                    </div>
                  </div>
                </ion-col>
              </ion-row>

            </ion-col>
          </ion-row>

        </ion-col>
        <ion-col size="2"></ion-col>
      </ion-row>

    </div>
  </div>
</main>

<ion-modal #orderTypeModal [isOpen]="isOrderTypeModalOpen" (didDismiss)="onModalDismiss()">
  <ng-template>
    <app-ordertype-modal 
      (closeModalEvent)="closeModal()"
      (orderTypeSelected)="onOrderTypeSelected($event)">
    </app-ordertype-modal>
  </ng-template>
</ion-modal>
